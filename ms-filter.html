<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>M&amp;S Ready Meals — Filter</title>
    <link rel="stylesheet" href="assets/filter.css" />
    <script src="assets/freshness.js" defer></script>
  </head>
  <body>
    <!--
  Shared site nav. Inlined into every page (no JS partials in a static site).
  Keep markup IDENTICAL across pages — only the `aria-current` attribute moves
  to mark the active page.
-->
    <nav class="site-nav">
      <a class="site-nav-brand" href="index.html">Meal Optimiser</a>
      <a href="meal-analysis.html">Dashboard</a>
      <a href="tesco-filter.html">Tesco</a>
      <a aria-current="page" href="ms-filter.html">M&amp;S</a>
      <a href="iceland-filter.html">Iceland</a>
      <a href="parsleybox-filter.html">Parsley Box</a>
    </nav>
    <h1>M&amp;S Ready Meals (Ocado) — Filter Tool</h1>
    <p class="page-sub">
      Data last refreshed:
      <span class="ts last-refreshed">loading...</span>
    </p>
    <div id="stats">
      <div class="stat">
        <div class="val" id="s-count">—</div>
        <div class="lbl">meals kept</div>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <div class="val" id="s-price">—</div>
        <div class="lbl">avg price (deal)</div>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <div class="val" id="s-kcal">—</div>
        <div class="lbl">avg kcal</div>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <div class="val" id="s-protein">—</div>
        <div class="lbl">avg protein</div>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <div class="val" id="s-cpp">—</div>
        <div class="lbl">£/g protein</div>
      </div>
    </div>

    <div id="controls">
      <input type="text" id="search" placeholder="Filter by name…" oninput="applyFilter()" />
      <button onclick="selectAll(false)">Restore all</button>
      <button class="danger" onclick="selectAll(true)">Exclude all visible</button>
      <span id="excluded-count"></span>
    </div>

    <table id="tbl">
      <thead>
        <tr>
          <th class="excl">✕</th>
          <th onclick="sortBy('name')">Name</th>
          <th onclick="sortBy('size')">Size</th>
          <th onclick="sortBy('price')">Price</th>
          <th onclick="sortBy('dealPrice')">Deal price</th>
          <th onclick="sortBy('kcal')">Kcal</th>
          <th onclick="sortBy('protein')">Protein</th>
          <th onclick="sortBy('ppp')">£/protein g</th>
          <th onclick="sortBy('pkc')">p/kcal</th>
          <th onclick="sortBy('score')">Score</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <script>
      const KEY = 'ms';
      let products = [];
      async function loadProducts() {
        const r = await fetch('data/ms_all_products.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const raw = await r.json();
        // Three observed JSON shapes across scraper outputs:
        //   tesco       -> { "frozen":   [...] }
        //   ms          -> [...]                     (bare list at root)
        //   parsleybox  -> { "products": [...] }
        //   iceland     -> { "products": [...] }
        products = Array.isArray(raw) ? raw : raw.frozen || raw.products || [];
      }

      let excluded = new Set();
      let currentSort = { key: 'score', dir: -1 };
      let searchTerm = '';

      function ocadoUrl(p) {
        if (!p.ocadoSlug) return null;
        return `https://www.ocado.com/products/${p.ocadoSlug}/${p.id}`;
      }

      function fmt(v, d = 1) {
        return v == null ? '<span class="null">—</span>' : v.toFixed(d);
      }

      function render() {
        const term = searchTerm.toLowerCase();
        const rows = products
          .filter(p => !term || p.name.toLowerCase().includes(term))
          .map(p => ({
            ...p,
            ppp: p.dealPrice && p.protein ? p.dealPrice / p.protein : null,
            pkc: p.dealPrice && p.kcal ? (p.dealPrice * 100) / p.kcal : null,
            score: p.dealPrice && p.kcal && p.protein ? (p.protein * p.protein * 4) / (p.dealPrice * p.kcal) : null,
          }))
          .sort((a, b) => {
            let av = a[currentSort.key],
              bv = b[currentSort.key];
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (typeof av === 'string') return av.localeCompare(bv) * currentSort.dir;
            return (av - bv) * currentSort.dir;
          });

        document.getElementById('tbody').innerHTML = rows
          .map(p => {
            const ex = excluded.has(p.id);
            const url = ocadoUrl(p);
            const nameCell = url
              ? `<a href="${url}" target="_blank" rel="noopener">${p.name}</a>`
              : `${p.name} <span style="color:#bbb;font-size:11px;">(no link)</span>`;
            const dealTag =
              p.dealPrice != null && p.price != null && p.dealPrice < p.price
                ? `<br><span class="deal">Any 3 for £10 → £${p.dealPrice.toFixed(2)}</span>`
                : '';
            const priceCell = p.price != null ? `£${p.price.toFixed(2)}` : '<span class="null">—</span>';
            const dealPriceCell = p.dealPrice != null ? `£${p.dealPrice.toFixed(2)}` : '<span class="null">—</span>';
            return `<tr class="${ex ? 'excluded' : ''}" data-id="${p.id}">
      <td class="excl"><input type="checkbox" ${ex ? 'checked' : ''} onchange="toggle('${p.id}')"></td>
      <td class="name">${nameCell}</td>
      <td>${p.size || '—'}</td>
      <td class="price">${priceCell}${dealTag}</td>
      <td class="price">${dealPriceCell}</td>
      <td class="kcal">${fmt(p.kcal, 0)}</td>
      <td class="protein">${fmt(p.protein, 1)}<small>g</small></td>
      <td class="protein">${p.ppp != null ? '£' + fmt(p.ppp, 3) : '<span class="null">—</span>'}</td>
      <td class="protein">${p.pkc != null ? fmt(p.pkc, 2) + 'p' : '<span class="null">—</span>'}</td>
      <td class="protein" style="font-weight:${p.score > 3 ? '700' : '400'};color:${p.score > 3 ? '#2e7d32' : p.score > 1.5 ? 'inherit' : '#aaa'}">${p.score != null ? fmt(p.score, 2) : '<span class="null">—</span>'}</td>
    </tr>`;
          })
          .join('');

        updateStats();
        document.getElementById('excluded-count').textContent = excluded.size ? `${excluded.size} excluded` : '';
      }

      function updateStats() {
        const kept = products.filter(p => !excluded.has(p.id));
        const prices = kept.map(p => p.dealPrice || p.price).filter(x => x);
        const kcals = kept.map(p => p.kcal).filter(x => x && x > 100);
        const proteins = kept.map(p => p.protein).filter(x => x && x > 1 && x < 100);
        const ppps = kept.filter(p => p.dealPrice && p.protein && p.protein < 100).map(p => p.dealPrice / p.protein);
        const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
        const ap = avg(prices),
          ak = avg(kcals),
          apr = avg(proteins),
          appp = avg(ppps);
        document.getElementById('s-count').textContent = kept.length;
        document.getElementById('s-price').textContent = ap ? '£' + ap.toFixed(2) : '—';
        document.getElementById('s-kcal').textContent = ak ? Math.round(ak) : '—';
        document.getElementById('s-protein').textContent = apr ? apr.toFixed(1) + 'g' : '—';
        document.getElementById('s-cpp').textContent = appp ? '£' + appp.toFixed(3) : '—';
      }

      function toggle(id) {
        excluded.has(id) ? excluded.delete(id) : excluded.add(id);
        render();
        scheduleSave();
      }
      function selectAll(ex) {
        const t = searchTerm.toLowerCase();
        products
          .filter(p => !t || p.name.toLowerCase().includes(t))
          .forEach(p => (ex ? excluded.add(p.id) : excluded.delete(p.id)));
        render();
        scheduleSave();
      }
      function applyFilter() {
        searchTerm = document.getElementById('search').value;
        render();
      }
      function sortBy(k) {
        currentSort.key === k ? (currentSort.dir *= -1) : (currentSort = { key: k, dir: 1 });
        render();
      }

      const LS_KEY = 'excl_' + KEY;
      let saveTimer = null;
      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveExclusions, 400);
      }
      function saveExclusions() {
        localStorage.setItem(LS_KEY, JSON.stringify([...excluded]));
      }
      function loadExclusions() {
        try {
          JSON.parse(localStorage.getItem(LS_KEY) || '[]').forEach(id => excluded.add(id));
        } catch (e) {}
        render();
      }
      (async () => {
        try {
          await loadProducts();
        } catch (e) {
          document.getElementById('tbody').innerHTML =
            '<tr><td colspan="99" style="padding:20px;text-align:center;color:#f85149">' +
            'Failed to load M&S ready meals via Ocado: ' +
            e.message +
            '</td></tr>';
          return;
        }
        loadExclusions();
      })();
    </script>
  </body>
</html>
