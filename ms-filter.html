let excluded = new Set();
let currentSort = {key: 'score', dir: -1};
let searchTerm = '';

function ocadoUrl(p) {
  if (!p.ocadoSlug) return null;
  return `https://www.ocado.com/products/${p.ocadoSlug}/${p.id}`;
}

function fmt(v, d=1) { return v==null ? '<span class="null">—</span>' : v.toFixed(d); }

function render() {
  const term = searchTerm.toLowerCase();
  const rows = products
    .filter(p => !term || p.name.toLowerCase().includes(term))
    .map(p => ({...p, ppp: p.dealPrice && p.protein ? p.dealPrice/p.protein : null, pkc: p.dealPrice && p.kcal ? p.dealPrice*100/p.kcal : null, score: p.dealPrice && p.kcal && p.protein ? (p.protein*p.protein*4)/(p.dealPrice*p.kcal) : null}))
    .sort((a,b) => {
      let av=a[currentSort.key], bv=b[currentSort.key];
      if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
      if(typeof av==='string') return av.localeCompare(bv)*currentSort.dir;
      return (av-bv)*currentSort.dir;
    });

  document.getElementById('tbody').innerHTML = rows.map(p => {
    const ex = excluded.has(p.id);
    const url = ocadoUrl(p);
    const nameCell = url
      ? `<a href="${url}" target="_blank" rel="noopener">${p.name}</a>`
      : `${p.name} <span style="color:#bbb;font-size:11px;">(no link)</span>`;
    const dealTag = p.dealPrice < p.price
      ? `<br><span class="deal">Any 3 for £10 → £${p.dealPrice.toFixed(2)}</span>` : '';
    return `<tr class="${ex?'excluded':''}" data-id="${p.id}">
      <td class="excl"><input type="checkbox" ${ex?'checked':''} onchange="toggle('${p.id}')"></td>
      <td class="name">${nameCell}</td>
      <td>${p.size||'—'}</td>
      <td class="price">£${p.price.toFixed(2)}${dealTag}</td>
      <td class="price">£${p.dealPrice.toFixed(2)}</td>
      <td class="kcal">${fmt(p.kcal,0)}</td>
      <td class="protein">${fmt(p.protein,1)}<small>g</small></td>
      <td class="protein">${p.ppp!=null?'£'+fmt(p.ppp,3):'<span class="null">—</span>'}</td>
      <td class="protein">${p.pkc!=null?fmt(p.pkc,2)+'p':'<span class="null">—</span>'}</td>
      <td class="protein" style="font-weight:${p.score>3?'700':'400'};color:${p.score>3?'#2e7d32':p.score>1.5?'inherit':'#aaa'}">${p.score!=null?fmt(p.score,2):'<span class="null">—</span>'}</td>
    </tr>`;
  }).join('');

  updateStats();
  document.getElementById('excluded-count').textContent = excluded.size ? `${excluded.size} excluded` : '';
}

function updateStats() {
  const kept = products.filter(p => !excluded.has(p.id));
  const prices   = kept.map(p => p.dealPrice||p.price).filter(x=>x);
  const kcals    = kept.map(p => p.kcal).filter(x=>x&&x>100);
  const proteins = kept.map(p => p.protein).filter(x=>x&&x>1&&x<100);
  const ppps     = kept.filter(p=>p.dealPrice&&p.protein&&p.protein<100).map(p=>p.dealPrice/p.protein);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const ap=avg(prices), ak=avg(kcals), apr=avg(proteins), appp=avg(ppps);
  document.getElementById('s-count').textContent = kept.length;
  document.getElementById('s-price').textContent = ap ? '£'+ap.toFixed(2) : '—';
  document.getElementById('s-kcal').textContent = ak ? Math.round(ak) : '—';
  document.getElementById('s-protein').textContent = apr ? apr.toFixed(1)+'g' : '—';
  document.getElementById('s-cpp').textContent = appp ? '£'+appp.toFixed(3) : '—';
}

function toggle(id) { excluded.has(id)?excluded.delete(id):excluded.add(id); render(); scheduleSave(); }
function selectAll(ex) {
  const t=searchTerm.toLowerCase();
  products.filter(p=>!t||p.name.toLowerCase().includes(t)).forEach(p=>ex?excluded.add(p.id):excluded.delete(p.id));
  render(); scheduleSave();
}
function applyFilter() { searchTerm=document.getElementById('search').value; render(); }
function sortBy(k) { currentSort.key===k?currentSort.dir*=-1:(currentSort={key:k,dir:1}); render(); }

const LS_KEY = 'excl_' + KEY;
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveExclusions, 400); }
function saveExclusions() {
  localStorage.setItem(LS_KEY, JSON.stringify([...excluded]));
}
function loadExclusions() {
  try {
    JSON.parse(localStorage.getItem(LS_KEY) || '[]').forEach(id=>excluded.add(id));
  } catch(e) {}
  render();
}
loadExclusions();
</script>
