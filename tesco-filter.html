const FINEST_IDS = new Set(['321836690','317411426','316301691','317411115','317289714','314847128','314590943','314703754','321854754']);

let excluded = new Set();
let currentSort = {key: 'score', dir: -1};
let searchTerm = '';

function fmt(v, digits=2) { return v == null ? '<span class="null">—</span>' : v.toFixed(digits); }

function effPrice(p) { return p.ccPrice || p.price; }

function ppp(p) {
  const ep = effPrice(p);
  if (!ep || !p.protein) return null;
  return ep / p.protein;
}

function render() {
  const term = searchTerm.toLowerCase();
  const rows = products
    .filter(p => !term || p.name.toLowerCase().includes(term))
    .map(p => {
      const ep = effPrice(p);
      return { ...p, ep,
        ppp:   ep && p.protein ? ep / p.protein : null,
        pkc:   ep && p.kcal   ? ep * 100 / p.kcal : null,
        score: ep && p.kcal && p.protein ? (p.protein * p.protein * 4) / (ep * p.kcal) : null
      };
    })
    .sort((a, b) => {
      let av = a[currentSort.key], bv = b[currentSort.key];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'string') return av.localeCompare(bv) * currentSort.dir;
      return (av - bv) * currentSort.dir;
    });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(p => {
    const ex = excluded.has(p.id);
    const finest = FINEST_IDS.has(p.id);
    return `<tr class="${ex ? 'excluded' : ''} ${finest ? 'finest' : ''}" data-id="${p.id}">
      <td class="excl"><input type="checkbox" ${ex ? 'checked' : ''} onchange="toggle('${p.id}')"></td>
      <td class="name"><a href="https://www.tesco.com/groceries/en-GB/products/${p.id}" target="_blank" rel="noopener">${p.name}</a></td>
      <td class="price">${p.ep != null ? '£'+p.ep.toFixed(2)+(p.ccPrice ? ' <span style="font-size:10px;color:#1a6a2c;font-weight:700;">'+(p.deal ? p.deal+' CC' : 'CC')+'</span>' : '') : '<span class="null">—</span>'}</td>
      <td class="kcal">${fmt(p.kcal, 0)}</td>
      <td class="protein">${fmt(p.protein, 1)}<small>g</small></td>
      <td class="protein">${p.ppp != null ? fmt(p.ppp, 3) : '<span class="null">—</span>'}</td>
      <td class="protein">${p.pkc != null ? fmt(p.pkc, 2)+'p' : '<span class="null">—</span>'}</td>
      <td class="protein" style="font-weight:${p.score>3?'700':'400'};color:${p.score>3?'#2e7d32':p.score>1.5?'inherit':'#aaa'}">${p.score != null ? fmt(p.score, 2) : '<span class="null">—</span>'}</td>
    </tr>`;
  }).join('');

  updateStats();
  updateExcludedCount();
}

function updateStats() {
  const kept = products.filter(p => !excluded.has(p.id));
  const prices = kept.map(p => effPrice(p)).filter(x => x != null);
  const kcals = kept.map(p => p.kcal).filter(x => x != null && x > 100);
  const proteins = kept.map(p => p.protein).filter(x => x != null && x > 1 && x < 100);
  const ppps = kept.filter(p => p.price && p.protein && p.protein < 100 && p.protein > 1).map(p => p.price / p.protein);

  const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null;
  const ap = avg(prices), ak = avg(kcals), apr = avg(proteins), appp = avg(ppps);
  document.getElementById('s-count').textContent = kept.length;
  document.getElementById('s-price').textContent = ap != null ? '£'+ap.toFixed(2) : '—';
  document.getElementById('s-kcal').textContent = ak != null ? Math.round(ak) : '—';
  document.getElementById('s-protein').textContent = apr != null ? apr.toFixed(1)+'g' : '—';
  document.getElementById('s-cpp').textContent = appp != null ? '£'+appp.toFixed(3) : '—';
}

function updateExcludedCount() {
  const n = excluded.size;
  document.getElementById('excluded-count').textContent = n ? `${n} excluded` : '';
}

function toggle(id) {
  if (excluded.has(id)) excluded.delete(id);
  else excluded.add(id);
  render();
}

function selectAll(excl) {
  const term = searchTerm.toLowerCase();
  products
    .filter(p => !term || p.name.toLowerCase().includes(term))
    .forEach(p => excl ? excluded.add(p.id) : excluded.delete(p.id));
  render();
}

function applyFilter() {
  searchTerm = document.getElementById('search').value;
  render();
}

function sortBy(key) {
  if (currentSort.key === key) currentSort.dir *= -1;
  else { currentSort.key = key; currentSort.dir = 1; }
  // Update header arrows
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  render();
}

function showExport() {
  const area = document.getElementById('export-area');
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
  document.getElementById('export-text').value = JSON.stringify([...excluded], null, 2);
}

// Exclusions persist in browser localStorage only — your edits are personal.
const LS_KEY = 'excl_tesco';
let saveTimer = null;

function loadExclusions() {
  try {
    const ids = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    ids.forEach(id => excluded.add(id));
  } catch(e) {}
  render();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveExclusions, 400);
}

function saveExclusions() {
  localStorage.setItem(LS_KEY, JSON.stringify([...excluded]));
}

// Wrap toggle to also save
const _origToggle = toggle;
window.toggle = function(id) {
  _origToggle(id);
  scheduleSave();
};
const _origSelectAll = selectAll;
window.selectAll = function(excl) {
  _origSelectAll(excl);
  scheduleSave();
};

// Initial load — fetch exclusions from server, then render
loadExclusions();
</script>
