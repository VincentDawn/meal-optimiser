name: ci

# Single workflow for the whole pipeline:
#   format    -> prettier --check (cheap, fail-fast)
#   playwright -> 49 browser tests (~30 sec on Ubuntu)
#   gitleaks   -> full-history secret scan
#   deploy    -> only on push to main, only if all three above passed.
#                Deploys the static site to GitHub Pages via the Actions
#                deploy mode (not branch source) so a red commit cannot ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  format:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Prettier check
        run: npx prettier --check '**/*.{js,css,html,json,md}'

  playwright:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run tests
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run gitleaks directly rather than the marketplace action — the action
      # tries to do incremental scans based on the previous push's SHA, which
      # blows up after any history-rewrite force-push.  Direct invocation
      # always scans the whole repo + history.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp
          /tmp/gitleaks version
      - name: Scan repo + git history
        run: /tmp/gitleaks detect --source=. --verbose --no-banner --redact

  deploy:
    needs: [format, playwright, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root — no build step, the static site IS the repo.
          # node_modules / tests / .github / .dev-tools aren't referenced by
          # any HTML so they're harmless dead weight in the Pages bundle.
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
